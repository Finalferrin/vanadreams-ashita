; Vanadreams boot config for Ashita v4.
; Copy this file to Ashita-v4beta\config\boot\vanadreams.ini and set the xiloader path.
; Everything below [ashita.boot] is the only part that differs from example-privateserver.ini.

[ashita.boot]
; Ashita's bundled bootloader (bootloader\pol.exe) cannot connect to Vanadreams. Use xiloader.
file        = C:\\path\\to\\xiloader.exe
command     = --server vanadreams.fairywitch.ca
gamemodule  = ffximain.dll
script      = default.txt
args        =
